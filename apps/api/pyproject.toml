[tool.poetry]
name = "aidev-api"
version = "0.1.0"
description = "FastAPI backend for the AI Developer platform."
authors = ["Moksha89"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
sqlalchemy = "^2.0"
alembic = "^1.13"
psycopg = { extras = ["binary"], version = "^3.2" }
pydantic = { extras = ["email"], version = "^2.7" }
pydantic-settings = "^2.4"
python-jose = { extras = ["cryptography"], version = "^3.3" }
passlib = { extras = ["bcrypt"], version = "^1.7" }
# passlib 1.7.4 reads `bcrypt.__about__.__version__` at import time; that
# attribute was removed in bcrypt 4.1, so the CryptContext fails to initialise
# on bcrypt >= 4.1 (login then returns 401 for every password). Pin until we
# either upgrade to passlib 1.7.5+ or migrate to argon2.
bcrypt = ">=4.0,<4.1"
celery = { extras = ["redis"], version = "^5.4" }
httpx = "^0.27"
python-multipart = "^0.0.9"
aidev-shared = { path = "../../packages/shared/python", develop = true }
aidev-rules-engine = { path = "../../packages/rules-engine", develop = true }
aidev-github-client = { path = "../../packages/github-client", develop = true }
aidev-model-client = { path = "../../packages/model-client", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
ruff = "^0.6"
mypy = "^1.10"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["B008"]   # FastAPI uses default-arg Depends() everywhere

[tool.pytest.ini_options]
asyncio_mode = "auto"
