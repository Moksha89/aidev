[tool.poetry]
name = "aidev-rules-engine"
version = "0.1.0"
description = "Phase-aware path enforcement for the AI Developer platform."
authors = ["Moksha89"]
readme = "README.md"
packages = [{ include = "aidev_rules_engine" }]

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = "^6.0"
aidev-shared = { path = "../shared/python", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
