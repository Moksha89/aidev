[tool.poetry]
name = "aidev-shared"
version = "0.1.0"
description = "Shared enums and types for the AI Developer platform."
authors = ["Moksha89"]
readme = "../README.md"
packages = [{ include = "aidev_shared" }]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
