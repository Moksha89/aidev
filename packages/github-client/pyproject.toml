[tool.poetry]
name = "aidev-github-client"
version = "0.1.0"
description = "Thin GitHub REST client for the AI Developer platform."
authors = ["Moksha89"]
readme = "README.md"
packages = [{ include = "aidev_github" }]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27"
pyjwt = { extras = ["crypto"], version = "^2.8" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
