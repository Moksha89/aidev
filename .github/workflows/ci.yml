name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint-and-test:
    name: Python (lint + test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/rules-engine
          - packages/github-client
          - packages/model-client
          - packages/shared
          - apps/api
          - workers/agent-runner
          - workers/sandbox-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install poetry
        run: pipx install "poetry>=1.8"
      - name: Install deps
        working-directory: ${{ matrix.package }}
        run: |
          if [ -f pyproject.toml ]; then
            poetry install --with dev || poetry install
          fi
      - name: Ruff
        working-directory: ${{ matrix.package }}
        run: poetry run ruff check . || true
      - name: Pytest
        working-directory: ${{ matrix.package }}
        run: |
          if [ -d tests ]; then
            poetry run pytest -q
          else
            echo "No tests/ directory; skipping."
          fi

  web-lint-and-build:
    name: Next.js (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  docker-build:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: [python-lint-and-test, web-lint-and-build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: aidev/api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: aidev/web:ci
