# infra/sandbox/tinyproxy.conf
#
# Tinyproxy configuration for the per-task sandbox egress sidecar.
# Mounted by the `egress-proxy` service in `infra/docker-compose.yml`.
#
# Design:
#   * `FilterDefaultDeny Yes` makes the allowlist authoritative — every
#     request whose Host header doesn't match `/etc/tinyproxy/filter`
#     is rejected with 403.
#   * `FilterExtended` enables Python-style regex so we can anchor each
#     entry (^github\.com$, ^[^.]+\.npmjs\.org$, ...).
#   * `BindSame No` lets the daemon listen on the sandbox-side
#     interface only; the host-side interface is reachable from other
#     containers on the `aidev_sandbox_*` networks.
#   * `Allow` blocks restrict who can use the proxy. The sandboxes are
#     on the per-task internal network, so we allow the whole Docker
#     bridge range.

User tinyproxy
Group tinyproxy

Port 8888
Timeout 600

LogLevel Info
LogFile "/dev/stdout"
PidFile "/run/tinyproxy/tinyproxy.pid"

DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatHost "tinyproxy.aidev.invalid"

# --- allowlist filter ----------------------------------------------------
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
# FilterURLs is intentionally OFF: we match the Host header, not the URL
# path. Path-level filtering is too brittle for package mirrors.
FilterURLs Off

# --- who may use this proxy ---------------------------------------------
# Docker's default bridge networks live in 172.16.0.0/12. The
# per-task internal networks the sandbox-runner creates also fall
# inside that block. Tightening this further would require
# enumerating each task network's CIDR up-front, which is not how
# we provision them.
Allow 172.16.0.0/12
# Compose / dev: localhost only.
Allow 127.0.0.1

# Disable CONNECT method except on standard TLS ports — prevents the
# proxy from being abused as a generic TCP tunnel.
ConnectPort 443
ConnectPort 8443

DisableViaHeader Yes

# Reasonable default; the executor pushes lots of small package
# requests during install.
MaxClients 100
MinSpareServers 5
MaxSpareServers 20
StartServers 10
MaxRequestsPerChild 0
