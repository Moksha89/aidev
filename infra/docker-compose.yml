# infra/docker-compose.yml — Local + single-node production layout.
#
# This is the same file you can ship to the Ubuntu VPS. It does NOT
# include the model server because that's expected to be `ollama` /
# `vllm` running on the host (so it can talk to the GPU directly). The
# AIDEV_MODEL_BASE_URL env var points at it.
#
# Bring up:  docker compose -f infra/docker-compose.yml up -d --build
# Stop:      docker compose -f infra/docker-compose.yml down
#
# Sandboxes are launched ON DEMAND by the sandbox-runner worker via the
# host docker socket; they don't appear in this file.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIDEV_DB_NAME:-aidev}
      POSTGRES_USER: ${AIDEV_DB_USER:-aidev}
      POSTGRES_PASSWORD: ${AIDEV_DB_PASSWORD:?required}
    volumes:
      - aidev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIDEV_DB_USER:-aidev} -d ${AIDEV_DB_NAME:-aidev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aidev_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      AIDEV_DATABASE_URL: postgresql+psycopg://${AIDEV_DB_USER:-aidev}:${AIDEV_DB_PASSWORD}@postgres:5432/${AIDEV_DB_NAME:-aidev}
      AIDEV_REDIS_URL: redis://redis:6379/0
      AIDEV_SECRET_KEY: ${AIDEV_SECRET_KEY:?required}
      AIDEV_MODEL_BASE_URL: ${AIDEV_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      AIDEV_DEFAULT_MODEL: ${AIDEV_DEFAULT_MODEL:-llama3.1:8b-instruct}
      AIDEV_ADMIN_EMAIL: ${AIDEV_ADMIN_EMAIL:-admin@example.com}
      AIDEV_ADMIN_PASSWORD: ${AIDEV_ADMIN_PASSWORD:?required}
      AIDEV_CORS_ORIGINS: ${AIDEV_CORS_ORIGINS:-http://localhost:3000}
    # IP-only acceptance: publish the API on the host so it's reachable
    # at http://<vps-ip>:8000. The Traefik labels below are inert in
    # IP-only mode (the `traefik` service is profile-gated) and only
    # activate when you opt into the domain-based production mode.
    ports:
      - "${AIDEV_API_BIND:-0.0.0.0}:8000:8000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.aidev-api.rule=Host(`api.${AIDEV_DOMAIN:-aidev.local}`)
      - traefik.http.routers.aidev-api.entrypoints=websecure
      - traefik.http.routers.aidev-api.tls=true
      - traefik.http.services.aidev-api.loadbalancer.server.port=8000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # In IP-only mode this is the API URL the browser uses, e.g.
      # http://<ubuntu-vps-ip>:8000. Override in infra/.env.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-AI Developer}
    # IP-only acceptance: publish the dashboard on the host so it's
    # reachable at http://<vps-ip>:3000.
    ports:
      - "${AIDEV_WEB_BIND:-0.0.0.0}:3000:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.aidev-web.rule=Host(`${AIDEV_DOMAIN:-aidev.local}`)
      - traefik.http.routers.aidev-web.entrypoints=websecure
      - traefik.http.routers.aidev-web.tls=true
      - traefik.http.services.aidev-web.loadbalancer.server.port=3000

  agent-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      args:
        WORKER: agent-runner
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      AIDEV_DATABASE_URL: postgresql+psycopg://${AIDEV_DB_USER:-aidev}:${AIDEV_DB_PASSWORD}@postgres:5432/${AIDEV_DB_NAME:-aidev}
      AIDEV_REDIS_URL: redis://redis:6379/0
      AIDEV_MODEL_BASE_URL: ${AIDEV_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      AIDEV_DEFAULT_MODEL: ${AIDEV_DEFAULT_MODEL:-llama3.1:8b-instruct}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # v0.3 Docker socket proxy. The sandbox-runner used to bind-mount
  # /var/run/docker.sock directly, which meant a bug or compromise in
  # the worker process = root on the host. We now route every Docker
  # Engine API call through this proxy, which whitelists only the
  # endpoints the executor actually needs (containers, networks,
  # volumes, exec, images, ping, version) and rejects everything else
  # (swarm/services/tasks/nodes/secrets/configs/plugins/system/build/
  # commit/distribution/session/auth/events) with 403.
  #
  # The proxy itself is the only container that still binds the host
  # socket, and it binds it read-only. The proxy is a tiny haproxy
  # config — it does not execute any of the requests itself, only
  # filters them. See docs/SECURITY.md "Layer 6 — Docker socket
  # gatekeeper" for the threat model.
  docker-socket-proxy:
    container_name: aidev-docker-socket-proxy
    image: tecnativa/docker-socket-proxy:0.2.0
    restart: unless-stopped
    # Permission matrix. 1 = endpoint family is allowed, 0 = blocked
    # with HTTP 403. POST/DELETE on allowed families also require
    # POST=1. Everything not listed defaults to 0 in the image.
    environment:
      # Required by the Docker SDK on connect.
      PING: 1
      VERSION: 1
      # Endpoint families the executor uses.
      CONTAINERS: 1
      NETWORKS: 1
      VOLUMES: 1
      EXEC: 1
      IMAGES: 1
      # Permit the POST/PUT/DELETE verbs on the allowed families.
      POST: 1
      # Explicitly disabled. (Default-deny would already cover them;
      # listing them keeps the policy obvious to future reviewers.)
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
    # Read-only mount: the proxy only needs to forward Engine API
    # calls; it never writes to the socket.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Internal-only — never publish 2375 on the host. The
    # sandbox-runner reaches it on the compose network as
    # `docker-socket-proxy:2375`.
    expose:
      - "2375"
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # `docker version` requires VERSION=1; cleanest liveness check.
      test:
        - CMD-SHELL
        - "wget -qO- http://localhost:2375/_ping >/dev/null 2>&1 || exit 1"
      interval: 15s
      timeout: 3s
      retries: 5

  sandbox-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      args:
        WORKER: sandbox-runner
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      egress-proxy: { condition: service_started }
      docker-socket-proxy: { condition: service_started }
    environment:
      AIDEV_DATABASE_URL: postgresql+psycopg://${AIDEV_DB_USER:-aidev}:${AIDEV_DB_PASSWORD}@postgres:5432/${AIDEV_DB_NAME:-aidev}
      AIDEV_REDIS_URL: redis://redis:6379/0
      SANDBOX_EXECUTOR: ${SANDBOX_EXECUTOR:-docker}
      # v0.3: NO host docker.sock bind. All Engine API calls go
      # through the docker-socket-proxy service over TCP on the
      # compose network.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      AIDEV_SANDBOX_IMAGE: ${AIDEV_SANDBOX_IMAGE:-aidev/sandbox:latest}
      AIDEV_SANDBOX_CPUS: ${AIDEV_SANDBOX_CPUS:-2}
      AIDEV_SANDBOX_MEM_LIMIT: ${AIDEV_SANDBOX_MEM_LIMIT:-4g}
      AIDEV_SANDBOX_PIDS_LIMIT: ${AIDEV_SANDBOX_PIDS_LIMIT:-512}
      AIDEV_SANDBOX_TIMEOUT_SECONDS: ${AIDEV_SANDBOX_TIMEOUT_SECONDS:-1800}
      AIDEV_SANDBOX_AGENT_UID: ${AIDEV_SANDBOX_AGENT_UID:-10001}
      AIDEV_SANDBOX_EGRESS_PROXY_URL: http://aidev-egress-proxy:8888
      AIDEV_SANDBOX_EGRESS_PROXY_ALIAS: aidev-egress-proxy
      AIDEV_SANDBOX_MODEL_SERVER_HOST: ${AIDEV_SANDBOX_MODEL_SERVER_HOST:-}
      # Preview registration mode: `port` (IP-only acceptance, default)
      # or `traefik` (domain-based production).
      AIDEV_SANDBOX_PREVIEW_MODE: ${AIDEV_SANDBOX_PREVIEW_MODE:-port}
      AIDEV_SANDBOX_PREVIEW_HOST: ${AIDEV_SANDBOX_PREVIEW_HOST:-127.0.0.1}
      AIDEV_SANDBOX_PREVIEW_PORT_RANGE_START: ${AIDEV_SANDBOX_PREVIEW_PORT_RANGE_START:-31000}
      AIDEV_SANDBOX_PREVIEW_PORT_RANGE_END: ${AIDEV_SANDBOX_PREVIEW_PORT_RANGE_END:-31999}
      AIDEV_SANDBOX_PREVIEW_PORT: ${AIDEV_SANDBOX_PREVIEW_PORT:-3000}
      AIDEV_SANDBOX_TRAEFIK_DYNAMIC_DIR: /etc/traefik/dynamic/tasks
      AIDEV_SANDBOX_PREVIEW_DOMAIN: ${AIDEV_SANDBOX_PREVIEW_DOMAIN:-preview.aidev.local}
      AIDEV_SANDBOX_EVENT_CHANNEL: aidev.sandbox.events
    volumes:
      # NO direct docker.sock mount. The host socket is mounted only
      # by docker-socket-proxy (above) which exposes a filtered
      # subset of the Engine API on tcp://docker-socket-proxy:2375.
      # Shared with the Traefik service so per-task preview routers
      # appear under `/etc/traefik/dynamic/tasks/`.
      - ./traefik/dynamic/tasks:/etc/traefik/dynamic/tasks:rw

  egress-proxy:
    container_name: aidev-egress-proxy
    build:
      context: ./sandbox
      dockerfile: Dockerfile.egress
    restart: unless-stopped
    # No published ports: only reachable from the per-task internal
    # networks the sandbox-runner attaches it to at run time, plus
    # the default compose network for the worker itself.
    expose:
      - "8888"
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep tinyproxy >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 5

  # Traefik is only required for the future domain-based production
  # mode. Start it explicitly with:
  #   docker compose --profile traefik up -d traefik
  # In IP-only acceptance mode leave it stopped and reach services
  # directly on host ports 3000 / 8000.
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    profiles: ["traefik"]
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --api.dashboard=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Includes the dynamic tasks subdir written by sandbox-runner.
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - aidev_traefik_certs:/letsencrypt

volumes:
  aidev_pgdata:
  aidev_redis:
  aidev_traefik_certs:
