# Optional Nginx fallback if you don't want Traefik.
#
# The recommended deployment uses Traefik (see ../docker-compose.yml),
# but this file is here so a sysadmin can drop it into
# /etc/nginx/sites-enabled/ and run the platform behind an existing
# Nginx host.

upstream aidev_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream aidev_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name aidev.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aidev.example.com;

    ssl_certificate     /etc/letsencrypt/live/aidev.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aidev.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass         http://aidev_api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://aidev_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
