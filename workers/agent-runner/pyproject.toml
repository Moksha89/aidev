[tool.poetry]
name = "aidev-agent-runner"
version = "0.1.0"
description = "Celery worker that drives the multi-agent task lifecycle."
authors = ["Moksha89"]
readme = "README.md"
packages = [{ include = "agent_runner" }]

[tool.poetry.dependencies]
python = "^3.11"
celery = { extras = ["redis"], version = "^5.4" }
sqlalchemy = "^2.0"
psycopg = { extras = ["binary"], version = "^3.2" }
pydantic-settings = "^2.4"
httpx = "^0.27"
docker = "^7.1"
aidev-shared = { path = "../../packages/shared/python", develop = true }
aidev-rules-engine = { path = "../../packages/rules-engine", develop = true }
aidev-github-client = { path = "../../packages/github-client", develop = true }
aidev-model-client = { path = "../../packages/model-client", develop = true }
aidev-sandbox-runner = { path = "../sandbox-runner", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
